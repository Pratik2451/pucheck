
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PUCheck - Multi-Gas Emission Monitoring</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-slate-900 text-white min-h-screen">

  <!-- Header -->
  <div class="p-6 text-center">
    <h1 class="text-4xl font-bold">PUCheck</h1>
    <p class="text-slate-400">
      Continuous Multi-Gas Vehicular Emission Monitoring
    </p>
  </div>

  <!-- Gas Cards -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 px-6 mb-6">

    <div class="card">
      <h2>CO (ppm)</h2>
      <p id="co">--</p>
    </div>

    <div class="card">
      <h2>Other Gases Index</h2>
      <p id="other">--</p>
    </div>

    <div class="card">
      <h2>AQI (Calculated)</h2>
      <p id="aqi">--</p>
    </div>

    <div class="bg-slate-800 rounded-2xl p-6 shadow-xl text-center col-span-1 md:col-span-3">
      <h2 class="text-slate-400">
        Overall Compliance Status
      </h2>

      <p id="status" class="text-4xl font-bold mt-6">
        --
      </p>
    </div>

  </div>

  <!-- Charts -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 px-6 mb-6">

    <div class="bg-slate-800 p-6 rounded-2xl shadow-xl">
      <h2 class="text-xl mb-4">CO Trend</h2>
      <canvas id="coChart"></canvas>
    </div>

    <div class="bg-slate-800 p-6 rounded-2xl shadow-xl">
      <h2 class="text-xl mb-4">Other Gases Trend</h2>
      <canvas id="otherChart"></canvas>
    </div>

  </div>

  <!-- Violation Log -->
  <div class="bg-slate-800 m-6 p-6 rounded-2xl shadow-xl overflow-x-auto">

    <h2 class="text-xl mb-4">Violation Log</h2>

    <table class="w-full text-left">
      <thead>
        <tr class="text-slate-400">
          <th class="p-2">Time</th>
          <th class="p-2">Parameter</th>
          <th class="p-2">Value</th>
          <th class="p-2">Status</th>
        </tr>
      </thead>

      <tbody id="logTable"></tbody>
    </table>

  </div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp,
  query,
  orderBy,
  limit,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// Firebase Configuration
// const firebaseConfig = {
//   apiKey: "AIzaSyCz894_sh5YFdUNt_pzloS7Z7ZS2W0I5Rk",
//   authDomain: "crop-disease-detection-s-8f082.firebaseapp.com",
//   databaseURL: "https://console.firebase.google.com/u/0/project/pucheck/database/pucheck-default-rtdb/data/~2F?utm_source=chatgpt.com",
//   projectId: "crop-disease-detection-s-8f082",
//   storageBucket: "crop-disease-detection-s-8f082.firebasestorage.app",
//   messagingSenderId: "711242887626",
//   appId: "1:711242887626:web:52c080f180ccbc06f65f33",
//   measurementId: "G-6XSPJLB758"
// };
const firebaseConfig = {
  apiKey: "AIzaSyDm169OAPG3H-Dbrn4stTZUuvTK3BlE05o",
  authDomain: "pucheck.firebaseapp.com",
  databaseURL: "https://pucheck-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "pucheck",
  storageBucket: "pucheck.firebasestorage.app",
  messagingSenderId: "58362016367",
  appId: "1:58362016367:web:c59052f41b535b0ae7939a",
  measurementId: "G-GKEJN4465X"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const firestore = getFirestore(app);

const vehicleNumber = "MH12AB1234";
const vehicleRef = ref(
  db,
  `vehicles/${vehicleNumber}/latest`
);

const violationLogsRef = collection(firestore, "violation_logs");

// Internal Prototype Thresholds (Not Displayed)
const thresholds = {
  co: 1875,
  other: 400,
  aqi: 150
};

// Chart History
let history = {
  co: [],
  other: [],
  time: []
};

// Create Charts
function createChart(canvasId, label, dataKey, color) {

  const ctx = document
    .getElementById(canvasId)
    .getContext("2d");

  return new Chart(ctx, {

    type: "line",

    data: {
      labels: history.time,

      datasets: [{
        label: label,
        data: history[dataKey],
        borderColor: color,
        backgroundColor: color + "33",
        tension: 0.3
      }]
    },

    options: {
      responsive: true,

      scales: {
        y: {
          beginAtZero: true
        }
      }
    }

  });

}

// Initialize Charts
const coChart = createChart(
  "coChart",
  "CO (ppm)",
  "co",
  "lime"
);

const otherChart = createChart(
  "otherChart",
  "Other Gases",
  "other",
  "orange"
);

const logTable = document.getElementById("logTable");

// Update Dashboard Cards
function updateCard(id, value, limit) {

  const el = document.getElementById(id);

  el.textContent = value.toFixed(2);

  el.className = value > limit
    ? "text-4xl font-bold mt-4 text-red-500"
    : "text-4xl font-bold mt-4 text-green-400";

}

// AQI Calculation (Project Formula)
function calculateAQI(co, other) {

  return (0.6 * co) + (0.4 * other);

}

// Prevent duplicate logs for the same continuous violation episode.
// This browser-side flag survives refreshes on this device/browser.
const ACTIVE_VIOLATION_KEY = `pucheck_active_violation_${vehicleNumber}`;
let wasViolation = localStorage.getItem(ACTIVE_VIOLATION_KEY) === "true";

// Display one saved Firestore record in the existing table.
function renderViolationLog(log) {
  const row = document.createElement("tr");

  const timeCell = document.createElement("td");
  timeCell.className = "p-2";
  const logTime = log.timestamp?.toDate
    ? log.timestamp.toDate()
    : (log.timestamp ? new Date(log.timestamp) : null);
  timeCell.textContent = logTime ? logTime.toLocaleString() : "Saving time...";

  const parameterCell = document.createElement("td");
  parameterCell.className = "p-2";
  parameterCell.textContent = log.parameter || "Emission Threshold";

  const valueCell = document.createElement("td");
  valueCell.className = "p-2";
  valueCell.textContent =
    `CO: ${Number(log.co ?? 0).toFixed(2)} ppm | Other: ${Number(log.other ?? 0).toFixed(2)} | AQI: ${Number(log.aqi ?? 0).toFixed(2)}`;

  const statusCell = document.createElement("td");
  statusCell.className = "p-2 text-red-400";
  statusCell.textContent = log.status || "VIOLATED";

  row.append(timeCell, parameterCell, valueCell, statusCell);
  logTable.appendChild(row);
}

// Load the latest 100 saved records and keep the table updated.
const savedLogsQuery = query(
  violationLogsRef,
  orderBy("timestamp", "desc"),
  limit(100)
);

onSnapshot(
  savedLogsQuery,
  (snapshot) => {
    logTable.replaceChildren();
    snapshot.forEach((docSnapshot) => {
      renderViolationLog(docSnapshot.data());
    });
  },
  (error) => {
    console.error("Could not load violation history from Firestore:", error);
  }
);

// Save a violation to Firestore.
async function saveViolationLog(co, other, aqi) {
  try {
    await addDoc(violationLogsRef, {
      vehicleNumber,
      parameter: "Emission Threshold",
      co,
      other,
      aqi,
      status: "VIOLATED",
      timestamp: serverTimestamp()
    });
    console.info("Violation saved to Firestore.");
  } catch (error) {
    console.error("Failed to save violation to Firestore:", error);
  }
}

// Firebase Real-Time Listener
onValue(vehicleRef, (snapshot) => {

  const data = snapshot.val();

  if (!data) return;

  const co = Number(data.co ?? 0);
  const other = Number(data.other ?? 0);

  if (
    !Number.isFinite(co) ||
    !Number.isFinite(other)
  ) {
    console.error("Invalid sensor data received");
    return;
  }

  const aqi = calculateAQI(co, other);

  // Update Cards
  updateCard("co", co, thresholds.co);
  updateCard("other", other, thresholds.other);
  updateCard("aqi", aqi, thresholds.aqi);

  // Check Thresholds
  const violation =
    co > thresholds.co ||
    other > thresholds.other ||
    aqi > thresholds.aqi;

  // Overall Compliance Status
  const statusEl = document.getElementById("status");

  statusEl.textContent = violation
    ? "VIOLATED"
    : "COMPLIANT";

  statusEl.className = violation
    ? "text-4xl font-bold mt-6 text-red-500 animate-pulse"
    : "text-4xl font-bold mt-6 text-green-400";

  // Save only on the transition from compliant to violated.
  if (violation && !wasViolation) {
    saveViolationLog(co, other, aqi);
  }

  wasViolation = violation;
  localStorage.setItem(ACTIVE_VIOLATION_KEY, String(wasViolation));

  // Update Chart History
  const ts = new Date().toLocaleTimeString();

  history.time.push(ts);
  history.co.push(co);
  history.other.push(other);

  // Keep Only Last 50 Readings
  if (history.time.length > 50) {

    history.time.shift();
    history.co.shift();
    history.other.shift();

  }

  // Refresh Charts
  coChart.update();
  otherChart.update();

});

</script>

<style>

.card {
  background-color: #1e293b;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.card h2 {
  color: #94a3b8;
}

.card p {
  font-size: 2.2rem;
  font-weight: bold;
  margin-top: 10px;
}

</style>

</body>
</html>
